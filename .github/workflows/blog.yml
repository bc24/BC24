name: Neueste Blogartikel

on:
  schedule:
    - cron: "0 5 * * *"   # täglich 05:00 UTC
  workflow_dispatch:       # manuell über den Actions-Tab startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README aktualisieren
        run: python .github/scripts/blog.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Blogartikel aktualisiert" && git push)
